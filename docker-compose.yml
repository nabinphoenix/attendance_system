services:
  postgres:
    image: postgres:17-alpine
    container_name: antimbench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: antimbench
      POSTGRES_USER: antimbench
      POSTGRES_PASSWORD: antimbench
    ports:
      - "5433:5432"
    volumes:
      - antimbench_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antimbench -d antimbench"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  antimbench_postgres_data:
