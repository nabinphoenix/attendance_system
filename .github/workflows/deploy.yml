name: AntimBench CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: antimbench-production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Validate application
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: antimbench_test
          POSTGRES_PASSWORD: antimbench_test_password
          POSTGRES_DB: antimbench_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U antimbench_test -d antimbench_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://antimbench_test:antimbench_test_password@127.0.0.1:5432/antimbench_test
      JWT_SECRET_KEY: a-test-only-secret-with-at-least-16-characters

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.8.15"

      - name: Install locked backend dependencies
        working-directory: backend
        run: uv sync --locked --all-groups

      - name: Apply backend migrations
        working-directory: backend
        run: uv run --locked alembic upgrade head

      - name: Validate Alembic head
        working-directory: backend
        run: |
          set -euo pipefail
          test "$(uv run --locked alembic heads | wc -l)" -eq 1
          uv run --locked alembic current

      - name: Run backend tests
        working-directory: backend
        run: uv run --locked pytest -q

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Package and deploy
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EB_APPLICATION_NAME: ${{ vars.EB_APPLICATION_NAME }}
      EB_ENVIRONMENT_NAME: ${{ vars.EB_ENVIRONMENT_NAME }}
      EB_S3_BUCKET: ${{ vars.EB_S3_BUCKET }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.8.15"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build production frontend bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build Linux backend runtime bundle
        working-directory: backend
        run: |
          set -euo pipefail

          # The x86_64 Linux runner resolves manylinux wheels that run on the
          # x86_64 Amazon Linux 2023 Elastic Beanstalk instance. `--no-build`
          # prevents an undeclared compiler toolchain from entering the bundle.
          rm -rf runtime-site-packages
          uv sync --locked --no-dev --no-install-project --link-mode=copy --no-build
          cp -a .venv/lib/python3.12/site-packages runtime-site-packages

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for required in AWS_REGION EB_APPLICATION_NAME EB_ENVIRONMENT_NAME EB_S3_BUCKET; do
            if [[ -z "${!required:-}" ]]; then
              echo "::error title=Missing deployment configuration::${required} must be configured before deployment."
              exit 1
            fi
          done

      - name: Create Elastic Beanstalk source bundle
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION_LABEL="antimbench-${GITHUB_SHA:0:12}-${GITHUB_RUN_NUMBER}"
          BUNDLE_DIR="${RUNNER_TEMP}/antimbench-eb-bundle"
          ARTIFACT_PATH="${RUNNER_TEMP}/${VERSION_LABEL}.zip"

          rm -rf "${BUNDLE_DIR}" "${ARTIFACT_PATH}"
          mkdir -p "${BUNDLE_DIR}/backend" "${BUNDLE_DIR}/frontend"

          cp Procfile "${BUNDLE_DIR}/"
          cp -a .platform "${BUNDLE_DIR}/"
          cp backend/alembic.ini backend/pyproject.toml backend/uv.lock "${BUNDLE_DIR}/backend/"
          rsync -a --exclude=__pycache__ --exclude='*.pyc' backend/app backend/migrations "${BUNDLE_DIR}/backend/"
          rsync -a backend/runtime-site-packages/ "${BUNDLE_DIR}/backend/runtime-site-packages/"

          # `output: standalone` traces the minimum Node runtime. Next.js does
          # not copy public assets or static chunks into it, so add those two
          # directories explicitly as documented by Next.js.
          rsync -a frontend/.next/standalone/ "${BUNDLE_DIR}/frontend/"
          mkdir -p "${BUNDLE_DIR}/frontend/.next"
          rsync -a frontend/.next/static/ "${BUNDLE_DIR}/frontend/.next/static/"
          if [[ -d frontend/public ]]; then
            rsync -a frontend/public/ "${BUNDLE_DIR}/frontend/public/"
          fi

          # Preserve executable hook permissions inside the ZIP regardless of the
          # repository checkout's filesystem mode.
          find "${BUNDLE_DIR}/.platform/hooks" -type f -exec chmod 755 {} +
          (cd "${BUNDLE_DIR}" && zip -qr "${ARTIFACT_PATH}" .)

          for required in \
            Procfile \
            .platform/hooks/prebuild/01-install-runtime-dependencies.sh \
            .platform/hooks/predeploy/01-run-migrations.sh \
            .platform/hooks/postdeploy/01-start-api-service.sh \
            backend/alembic.ini \
            backend/pyproject.toml \
            backend/uv.lock \
            backend/runtime-site-packages/alembic/__init__.py \
            frontend/server.js \
            frontend/.next/BUILD_ID \
            frontend/.next/static/; do
            if ! unzip -Z1 "${ARTIFACT_PATH}" | grep -Fxq "${required}"; then
              echo "::error title=Invalid deployment bundle::Required file is missing: ${required}"
              exit 1
            fi
          done

          while IFS= read -r archive_path; do
            case "${archive_path}" in
              frontend/node_modules|frontend/node_modules/*|backend/runtime-site-packages|backend/runtime-site-packages/*)
                # These are the intentionally traced/prebuilt production runtimes.
                ;;
              */node_modules|*/node_modules/*|.venv|.venv/*|*/.venv|*/.venv/*|\
              .git|.git/*|*/.git|*/.git/*|\
              .pytest_cache|.pytest_cache/*|*/.pytest_cache|*/.pytest_cache/*|\
              __pycache__|__pycache__/*|*/__pycache__|*/__pycache/*|\
              .env|.env/*|*/.env|*/.env/*|.env.*|*/.env.*|\
              certificates|certificates/*|*/certificates|*/certificates/*|\
              *.db|*/.next/cache|*/.next/cache/*|*/.next/dev|*/.next/dev/*|\
              */.next/diagnostics|*/.next/diagnostics/*|*/.next/types|*/.next/types/*)
                echo "::error title=Unsafe deployment bundle::Excluded path found: ${archive_path}"
                exit 1
                ;;
            esac
          done < <(unzip -Z1 "${ARTIFACT_PATH}")

          echo "version_label=${VERSION_LABEL}" >> "${GITHUB_OUTPUT}"
          echo "artifact_path=${ARTIFACT_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Create application version and deploy
        shell: bash
        env:
          VERSION_LABEL: ${{ steps.package.outputs.version_label }}
          ARTIFACT_PATH: ${{ steps.package.outputs.artifact_path }}
        run: |
          set -euo pipefail
          S3_KEY="antimbench/${VERSION_LABEL}.zip"

          echo "Commit: ${GITHUB_SHA}"
          echo "Version label: ${VERSION_LABEL}"
          echo "Target application: ${EB_APPLICATION_NAME}"
          echo "Target environment: ${EB_ENVIRONMENT_NAME}"
          echo "Region: ${AWS_REGION}"

          aws s3 cp "${ARTIFACT_PATH}" "s3://${EB_S3_BUCKET}/${S3_KEY}" --only-show-errors
          aws elasticbeanstalk create-application-version \
            --application-name "${EB_APPLICATION_NAME}" \
            --version-label "${VERSION_LABEL}" \
            --source-bundle S3Bucket="${EB_S3_BUCKET}",S3Key="${S3_KEY}" \
            --process \
            --no-auto-create-application
          aws elasticbeanstalk update-environment \
            --application-name "${EB_APPLICATION_NAME}" \
            --environment-name "${EB_ENVIRONMENT_NAME}" \
            --version-label "${VERSION_LABEL}" >/dev/null

      - name: Wait for a healthy Elastic Beanstalk environment
        shell: bash
        env:
          VERSION_LABEL: ${{ steps.package.outputs.version_label }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))

          while (( SECONDS < deadline )); do
            state="$(aws elasticbeanstalk describe-environments \
              --application-name "${EB_APPLICATION_NAME}" \
              --environment-names "${EB_ENVIRONMENT_NAME}" \
              --no-include-deleted \
              --query 'Environments[0].[Status,Health,VersionLabel]' \
              --output text)"

            if [[ -z "${state}" || "${state}" == None* ]]; then
              echo "::error title=Elastic Beanstalk environment not found::${EB_ENVIRONMENT_NAME} was not returned by Elastic Beanstalk."
              exit 1
            fi

            read -r status health deployed_version <<<"${state}"
            echo "Environment status=${status}; health=${health}; version=${deployed_version}"

            if [[ "${status}" == "Ready" && "${health}" == "Green" && "${deployed_version}" == "${VERSION_LABEL}" ]]; then
              echo "Elastic Beanstalk deployment is healthy."
              exit 0
            fi

            if [[ "${status}" == "Terminated" || "${health}" == "Red" ]]; then
              echo "::error title=Elastic Beanstalk deployment failed::Environment entered status=${status}, health=${health}."
              aws elasticbeanstalk describe-events \
                --application-name "${EB_APPLICATION_NAME}" \
                --environment-name "${EB_ENVIRONMENT_NAME}" \
                --max-records 20 \
                --query 'Events[].[EventDate,Severity,Message]' \
                --output table
              exit 1
            fi

            sleep 20
          done

          echo "::error title=Elastic Beanstalk deployment timed out::Environment did not become Ready and Green within 30 minutes."
          aws elasticbeanstalk describe-events \
            --application-name "${EB_APPLICATION_NAME}" \
            --environment-name "${EB_ENVIRONMENT_NAME}" \
            --max-records 20 \
            --query 'Events[].[EventDate,Severity,Message]' \
            --output table
          exit 1
