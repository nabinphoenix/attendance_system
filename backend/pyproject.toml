[project]
name = "antimbench-backend"
version = "0.1.0"
description = "AntimBench attendance and CRM API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0",
  "boto3>=1.38.0",
  "bcrypt==4.0.1",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "jinja2>=3.1.0",
  "openpyxl>=3.1.0",
  "pandas>=2.2.0",
  "passlib[bcrypt]>=1.7.4",
  "pillow>=10.0",
  "psycopg2-binary>=2.9.10",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.9.0",
  "python-jose[cryptography]>=3.4.0",
  "python-multipart>=0.0.20",
  "qrcode>=8.0",
  "reportlab>=4.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.34.0",
  "weasyprint>=65.0",
]

[dependency-groups]
dev = ["httpx>=0.28.0", "pytest>=8.3.0", "pytest-asyncio>=0.26.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
